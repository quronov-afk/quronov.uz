    t.addEventListener('click', function (ev) {
      ev.preventDefault();
      tugma.forEach(function (x) { x.classList.toggle('active', x === t); });
      ['video', 'foto'].forEach(function (nom) {
        var el = document.getElementById(nom);
        el.style.display = t.dataset.bolim === nom ? '' : 'none';
      });
    });
  });
})();
</script>
